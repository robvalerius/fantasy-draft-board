<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="cache-control" content="no-store">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117" id="themeColor">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Cheer Tracker">
<meta name="description" content="Who to cheer for and boo across four fantasy leagues, sorted by kickoff window.">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%230d1117'/%3E%3Ctext x='90' y='128' font-size='104' text-anchor='middle'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%94%A5%3C/text%3E%3C/svg%3E">
<title>Sunday Cheer Tracker — Week 1</title>
<style>
  :root{
    --bg:#0d1117; --panel:#161b22; --panel2:#1c2330; --line:#2a3140;
    --txt:#e6edf3; --dim:#8b949e; --faint:#586069;
    --good:#3fb950; --gold:#d29922; --fire:#f85149; --blue:#58a6ff;
    --onblue:#04121f; --hdrTop:#151c27; --hdrBot:#0d1117; --oppTxt:#ff7b72;
    --pillGoodTxt:#56d364; --pillGoodBd:#2ea04366; --pillGoodBg:#2ea04326;
    --statTxt:#79c0ff; --statBd:#388bfd55; --statBg:#388bfd26;
    --pillBadTxt:#ff8a80;  --pillBadBd:#f8514966;  --pillBadBg:#f8514922;
    --shadow:0 1px 0 rgba(0,0,0,.2);
  }
  html[data-theme="light"]{
    --bg:#f6f8fa; --panel:#ffffff; --panel2:#eef1f5; --line:#d6dde5;
    --txt:#1f2328; --dim:#59636e; --faint:#818b96;
    --good:#1a7f37; --gold:#9a6700; --fire:#cf222e; --blue:#0969da;
    --onblue:#ffffff; --hdrTop:#ffffff; --hdrBot:#f6f8fa; --oppTxt:#cf222e;
    --pillGoodTxt:#0f5c2a; --pillGoodBd:#1a7f3766; --pillGoodBg:#1a7f3714;
    --pillBadTxt:#a40e26;  --pillBadBd:#cf222e66;  --pillBadBg:#cf222e12;
    --statTxt:#0969da; --statBd:#0969da55; --statBg:#0969da12;
    --shadow:0 1px 2px rgba(31,35,40,.06);
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--txt);-webkit-text-size-adjust:100%;
    font:14px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif}
  header{padding:16px 16px 10px;padding-top:max(16px,env(safe-area-inset-top));border-bottom:1px solid var(--line);
    background:linear-gradient(180deg,var(--hdrTop),var(--hdrBot))}
  h1{margin:0 0 2px;font-size:20px;letter-spacing:.3px}
  .sub{color:var(--dim);font-size:12px}
  .wrap{max-width:1180px;margin:0 auto;padding:0 16px 60px;
  padding-left:max(16px,env(safe-area-inset-left));padding-right:max(16px,env(safe-area-inset-right))}
  .stickybar{position:sticky;top:0;z-index:6;background:var(--bg);
    border-bottom:1px solid var(--line);margin-bottom:10px;
    box-shadow:0 6px 12px -10px rgba(0,0,0,.55)}
  .controls{display:flex;flex-wrap:wrap;gap:8px;align-items:center;margin:0;padding:8px 0}
  .stickybar .controls+.controls{padding-top:0}
  button.tg{background:var(--panel2);color:var(--txt);border:1px solid var(--line);
    border-radius:20px;padding:6px 13px;font-size:12px;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button.tg.on{background:var(--blue);border-color:var(--blue);color:var(--onblue);font-weight:700}
  button.tg.lgf{border-left:4px solid var(--lgc)}
  input[type=search]{background:var(--panel2);border:1px solid var(--line);color:var(--txt);
    border-radius:20px;padding:6px 13px;font-size:16px;min-width:170px;outline:none}
  .sep{width:1px;height:20px;background:var(--line)}
  .slotbar{position:static;border-bottom:none;margin:0 0 4px;padding:0 0 8px}
  .barlbl{font-size:11px;text-transform:uppercase;letter-spacing:.9px;color:var(--dim)}
  .hdrrow{display:flex;align-items:flex-start;gap:12px}
  .hdrrow > div{min-width:0}
  #themeBtn{flex:none;margin-left:auto;font-size:15px;line-height:1;padding:7px 11px}
  .mtabs{display:none;gap:8px;margin:12px 0 4px}
  .mtabs button{flex:1;padding:11px 8px;font-size:14px;font-weight:700;border-radius:10px;
    border:1px solid var(--line);background:var(--panel);color:var(--dim);cursor:pointer}
  .mtabs button.on[data-side="cheer"]{background:var(--good);border-color:var(--good);color:#fff}
  .mtabs button.on[data-side="boo"]{background:var(--fire);border-color:var(--fire);color:#fff}
  h2.sec{font-size:13px;letter-spacing:1.2px;text-transform:uppercase;color:var(--dim);
    margin:26px 0 8px;padding-bottom:6px;border-bottom:1px solid var(--line)}
  h2.sec span.cnt{color:var(--faint);font-weight:400}
  .board{display:grid;grid-template-columns:1fr 1fr;gap:18px;align-items:start}
  .col{min-width:0}
  .colhdr{position:sticky;top:52px;z-index:4;background:var(--bg);padding:10px 0 8px;
    border-bottom:2px solid;margin-bottom:4px}
  .colhdr .big{font-size:17px;font-weight:800;letter-spacing:.3px}
  .col.cheer .colhdr{border-color:var(--good)} .col.cheer .big{color:var(--good)}
  .col.boo   .colhdr{border-color:var(--fire)} .col.boo   .big{color:var(--fire)}
  .row{display:flex;align-items:flex-start;gap:10px;background:var(--panel);border:1px solid var(--line);
    border-radius:9px;padding:9px 11px;margin-bottom:6px;border-left-width:4px;box-shadow:var(--shadow)}
  .row:hover{background:var(--panel2)}
  .rate{font-size:11px;letter-spacing:-2px;min-width:56px;line-height:1.6}
  .rate.up{color:var(--good);font-size:12px;letter-spacing:-1px}
  .who{flex:1;min-width:0}
  .who .nm{font-weight:650}
  .who .nm .pos{font-weight:400;color:var(--dim);font-size:11.5px}
  .who .meta{font-size:11.5px;color:var(--dim);margin-top:1px}
  .warn{color:var(--gold)}
  .pills{display:flex;flex-wrap:wrap;gap:4px;margin-top:5px}
  .pill{font-size:10.5px;padding:2px 8px;border-radius:20px;border:1px solid;white-space:nowrap;font-weight:600}
  .pill.mine{color:var(--pillGoodTxt);border-color:var(--pillGoodBd);background:var(--pillGoodBg)}
  .pill.opp {color:var(--pillBadTxt); border-color:var(--pillBadBd); background:var(--pillBadBg)}
  .pill.bench{font-weight:400;opacity:.62;background:transparent}
  .pill b{font-weight:700;font-variant-numeric:tabular-nums;margin-left:5px;
    padding-left:5px;border-left:1px solid currentColor;opacity:.85}
  .game{font-size:11px;color:var(--dim);min-width:66px;text-align:right;font-variant-numeric:tabular-nums}
  .delta{margin-top:6px;line-height:1.15}
  .delta b{display:block;font-size:16px;font-weight:800;font-variant-numeric:tabular-nums}
  .delta span{font-size:9px;text-transform:uppercase;letter-spacing:.4px;color:var(--dim)}
  .delta.good b{color:var(--good)}
  .delta.bad  b{color:var(--fire)}
  @keyframes pop{from{opacity:0;transform:translateY(-3px)}to{opacity:1;transform:none}}
  .delta{animation:pop .35s ease}
  .empty{color:var(--faint);font-size:12px;padding:6px 2px}
  /* Stat line: typographic, not bubbles. Big tabular number, tiny caps label. */
  .stats{display:flex;flex-wrap:wrap;gap:2px 14px;margin-top:6px;padding-top:5px;
    border-top:1px solid var(--bd)}
  .stat{display:inline-flex;align-items:baseline;gap:3px;white-space:nowrap;
    font-size:9px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--faint)}
  .stat b{font-size:13px;font-weight:800;letter-spacing:0;color:var(--statTxt);
    font-variant-numeric:tabular-nums;line-height:1}
  .stat.bad b{color:var(--pillBadTxt)}
  .stat.good b{color:var(--pillGoodTxt)}
  .pace{display:inline-flex;align-items:center;white-space:nowrap;font-size:9.5px;font-weight:800;
    letter-spacing:.05em;text-transform:uppercase;padding:2px 7px;border-radius:20px;
    color:var(--dim);background:var(--panel2);border:1px solid var(--line);margin-right:2px}
  .pace.good{color:var(--pillGoodTxt);background:var(--pillGoodBg);border-color:var(--pillGoodBd)}
  .pace.bad{color:var(--pillBadTxt);background:var(--pillBadBg);border-color:var(--pillBadBd)}
  .livebar{display:none;align-items:center;gap:8px;flex-wrap:wrap;margin:-2px 0 10px;
    font-size:11.5px;color:var(--dim)}
  .livebar.show{display:flex}
  /* Live matchup scoreboard */
  .scoreboard{display:none;gap:8px;flex-wrap:wrap;margin:0 0 12px}
  .scoreboard.show{display:flex}
  .sbcard{flex:1 1 210px;min-width:0;background:var(--panel);border:1px solid var(--line);
    border-left:4px solid var(--lgc);border-radius:10px;padding:8px 11px;box-shadow:var(--shadow);
    cursor:pointer;transition:border-color .15s,transform .1s;-webkit-tap-highlight-color:transparent;
    position:relative;overflow:hidden}
  .sbcard:hover{border-color:var(--lgc)}
  .sbcard:active{transform:scale(.985)}
  .sbcard.only{border-color:var(--lgc);box-shadow:0 0 0 2px var(--lgc) inset,var(--shadow)}
  .sbcard.only .sbname::after{content:" · only";color:var(--lgc)}
  .sbname{font-size:9.5px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--dim)}
  .sbemblem{position:absolute;top:6px;right:9px;font-size:30px;line-height:1;pointer-events:none}
  .sbscore{display:flex;align-items:baseline;gap:7px;font-variant-numeric:tabular-nums}
  .sbscore b{font-size:21px;font-weight:800;letter-spacing:-.4px}
  .sbscore b:first-of-type{color:var(--good)}
  .sbscore b:last-of-type{color:var(--fire)}
  .sbdash{color:var(--faint);font-size:14px}
  .sbwho{display:flex;gap:7px;font-size:9.5px;text-transform:uppercase;letter-spacing:.05em;
    color:var(--faint);font-weight:700}
  .sbwho span{margin-left:auto;text-align:right;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sbmargin{margin-top:4px;font-size:11px;font-weight:800;font-variant-numeric:tabular-nums;color:var(--dim)}
  .sbcard.win .sbmargin{color:var(--pillGoodTxt)}
  .sbcard.lose .sbmargin{color:var(--pillBadTxt)}
  .sbwait{flex:1 1 100%;font-size:10.5px;color:var(--faint);padding:2px}
  .dot{width:8px;height:8px;border-radius:50%;background:var(--faint);flex:none}
  .dot.ok{background:var(--good);box-shadow:0 0 0 3px color-mix(in srgb,var(--good) 25%,transparent)}
  .dot.err{background:var(--fire)}
  .livebar.demo{color:var(--gold)}
  .livebar.demo .dot.ok{background:var(--gold);box-shadow:0 0 0 3px color-mix(in srgb,var(--gold) 25%,transparent)}
  .dead{margin-top:22px;border-top:1px dashed var(--line);padding-top:12px}
  .dead summary{cursor:pointer;list-style:none;display:flex;align-items:center;gap:8px;flex-wrap:wrap;
    font-size:12px;font-weight:700;letter-spacing:.3px;text-transform:uppercase;color:var(--dim);
    padding:8px 11px;border:1px solid var(--line);border-radius:8px;background:var(--panel);
    -webkit-tap-highlight-color:transparent}
  .dead summary::-webkit-details-marker{display:none}
  .dead summary::before{content:"\25B8";font-size:11px;transition:transform .15s}
  .dead[open] summary::before{transform:rotate(90deg)}
  .dead .row{opacity:.6}
  .dead .row:hover{opacity:1}

  /* ---------- phone ---------- */
  @media(max-width:860px){
    header{padding:12px 14px 9px}
    h1{font-size:17px}
    .wrap{padding:0 12px 44px}
    .controls{gap:6px;padding:8px 0;overflow-x:auto;flex-wrap:nowrap;
      scrollbar-width:none;-ms-overflow-style:none}
    .controls::-webkit-scrollbar{display:none}
    .controls>*{flex:0 0 auto}
    button.tg{padding:7px 12px}
    input[type=search]{min-width:140px}
    .sep{display:none}
    #themeBtn{padding:7px 11px}
    .hdrrow{gap:8px}
    .mtabs{display:flex;position:sticky;top:47px;z-index:4;background:var(--bg);padding:8px 0}
    .board{grid-template-columns:1fr;gap:0}
    .colhdr{position:static;padding:2px 0 8px;border-bottom-width:1px}
    .colhdr .big{font-size:13px}
    .col{display:none}
    body[data-side="cheer"] .col.cheer{display:block}
    body[data-side="boo"]   .col.boo{display:block}
    h2.sec{margin:18px 0 6px;font-size:11.5px;letter-spacing:.8px}
    .row{padding:9px 10px;gap:8px;flex-wrap:wrap}
    .rate{min-width:0;order:1}
    .game{order:2;margin-left:auto;min-width:0;font-weight:600;color:var(--txt)}
    .who{order:3;flex:1 0 100%}
    .who .nm{font-size:15px}
    .who .nm .pos{display:block;font-size:11px;margin-top:1px}
    .who .meta{font-size:11.5px}
    /* Four cards side by side eat most of a phone screen, so wrap them into a 2x2 block. */
    .scoreboard{display:none;gap:6px}
    .scoreboard.show{display:grid;grid-template-columns:1fr 1fr}
    .sbcard{padding:6px 8px;border-left-width:3px;border-radius:8px}
    .sbname{font-size:8.5px;letter-spacing:.06em}
    .sbemblem{font-size:20px;top:5px;right:7px}
    .sbscore{gap:4px}
    .sbscore b{font-size:16px}
    .sbscore .sbdash{font-size:11px}
    .sbwho{font-size:8.5px;margin-top:1px}
    .sbmargin{margin-top:2px;font-size:10px}
    .sbwait{grid-column:1 / -1}
  }
</style>
</head>
<body>
<header>
  <div class="wrap" style="padding-bottom:0">
    <div class="hdrrow">
      <div>
        <h1>🏈 Sunday Cheer Tracker <span class="sub">— Week 1</span></h1>
      </div>
      <button class="tg" id="themeBtn" title="Toggle light / dark">🌙</button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="stickybar">
    <div class="controls">
      <button class="tg on" data-view="priority">By priority</button>
      <button class="tg" data-view="kickoff">By kickoff</button>
      <div class="sep"></div>
      <span id="lgfilters"></span>
      <div class="sep"></div>
      <input type="search" id="q" placeholder="Search player / team…">
      <div class="sep"></div>
      <button class="tg" id="liveBtn" title="Poll live NFL stats from Sleeper">📡 Live stats</button>
      <button class="tg" id="demoBtn" title="Preview the layout using real 2025 Week 1 box scores">🧪 Demo</button>
    </div>

    <div class="controls slotbar">
      <span class="barlbl">When:</span>
      <button class="tg on" id="allSlots">All games</button>
      <span id="slotfilters"></span>
    </div>

    <div class="mtabs">
      <button data-side="cheer" class="on">🙌 Cheer (<span id="cheerTab">0</span>)</button>
      <button data-side="boo">🙅 Boo (<span id="booTab">0</span>)</button>
    </div>
  </div>

  <div class="livebar" id="livebar"><span class="dot" id="liveDot"></span><span id="liveTxt">starting…</span></div>

  <div class="scoreboard" id="scoreboard"></div>

  <div class="board">
    <div class="col cheer">
      <div class="colhdr">
        <div class="big">🙌 CHEER FOR &nbsp;<span style="font-weight:400;color:#8b949e">(<span id="cheerCount">0</span>)</span></div>
      </div>
      <div id="cheerCol"></div>
    </div>
    <div class="col boo">
      <div class="colhdr">
        <div class="big">🙅 BOO &nbsp;<span style="font-weight:400;color:#8b949e">(<span id="booCount">0</span>)</span></div>
      </div>
      <div id="booCol"></div>
    </div>
  </div>

</div>

/* ---------- LEAGUE 2 · VALERIAN (Sleeper) ---------- */

const byWeight = a => a.sort((x,y)=>LG[y].w-LG[x].w);
const names = ids => ids.map(i=>LG[i].name).join(" + ");

const ALL = Object.values(players).map(p=>{
  p.startFor = byWeight([...new Set(p.tags.filter(t=>t.side==="for" && t.slot==="S").map(t=>t.lg))]);
  p.benchFor = byWeight([...new Set(p.tags.filter(t=>t.side==="for" && t.slot!=="S").map(t=>t.lg))]);
  p.startVs  = byWeight([...new Set(p.tags.filter(t=>t.side==="vs"  && t.slot==="S").map(t=>t.lg))]);
  p.benchVs  = byWeight([...new Set(p.tags.filter(t=>t.side==="vs"  && t.slot!=="S").map(t=>t.lg))]);

  // ---- simple 1-5 cheer level ----
  let c=0, why="";
  if (p.startFor.length>=3){ c=5; why=`Starting in ${p.startFor.length} of your 4 lineups`; }
  else if (p.startFor.length===2){ c=4; why=`Starting in 2 lineups — ${names(p.startFor)}`; }
  else if (p.startFor[0]==="L1"){ c=4; why="Starting in SHERIFF, your most important league"; }
  else if (p.startFor[0]==="L2"){ c=3; why="Starting in VALERIAN"; }
  else if (p.startFor.length===1){ c=2; why=`Starting in ${LG[p.startFor[0]].name}`; }
  else if (p.benchFor.length){ c=1; why=`Only on your bench — ${names(p.benchFor)}`; }
  if (c && p.benchFor.length && p.startFor.length) why += ` · bench in ${names(p.benchFor)}`;

  // ---- simple 1-5 boo level (only guys actually IN an opponent lineup can rank high) ----
  let b=0, bwhy="";
  if (p.startVs.length>=2){ b=5; bwhy=`Starting against you in ${p.startVs.length} leagues — ${names(p.startVs)}`; }
  else if (p.startVs[0]==="L1"){ b=4; bwhy="Starting against you in SHERIFF"; }
  else if (p.startVs[0]==="L2"){ b=3; bwhy="Starting against you in VALERIAN"; }
  else if (p.startVs.length===1){ b=2; bwhy=`Starting against you in ${LG[p.startVs[0]].name}`; }
  else if (p.benchVs.length){ b=1; bwhy=`Only riding an opponent's bench — ${names(p.benchVs)}`; }
  if (b>1 && p.benchVs.length) bwhy += ` · also benched by ${names(p.benchVs)}`;

  p.cheer=c; p.boo=b; p.why=why; p.bwhy=bwhy;
  p.conflict = c>0 && b>0;
  p.side = c>=b ? "cheer" : "boo";
  p.level = p.side==="cheer" ? c : b;
  // buckets are about how many lineups he's in — never about which league
  const n = p.side==="cheer" ? p.startFor.length : p.startVs.length;
  p.bucket = n>=2 ? 3 : n===1 ? 2 : 1;
  return p;
}).sort((a,b)=> b.bucket-a.bucket || b.level-a.level || a.name.localeCompare(b.name));

// Only the counting stats Rob asked for. Anything zero or missing is never drawn.
// Production stats are neutral. Turnovers and sacks are red on offence, because they
// hurt the guy you are watching, and green on a defence, which is credited for causing them.
const STAT_DEFS = [
  {k:"pass_yd", lbl:"pass yd"},
  {k:"pass_td", lbl:"pass TD"},
  {k:"rush_yd", lbl:"rush yd"},
  {k:"rush_td", lbl:"rush TD"},
  {k:"rec",     lbl:"rec"},
  {k:"rec_yd",  lbl:"rec yd"},
  {k:"rec_td",  lbl:"rec TD"},
  {k:"_fd",     lbl:"first downs"},
  {k:"kick_pts",lbl:"K pts"},
  {k:"_miss",   lbl:"K miss", tone:"bad"}
];
const OFF_BAD = [
  {k:"fum_lost",    lbl:"fum lost"},
  {k:"pass_int",    lbl:"INT"},
  {k:"pass_int_td", lbl:"pick 6"},
  {k:"pass_sack",   lbl:"sacked"}
];
// A defence is the beneficiary of these, so the same events read as good news.
const DEF_GOOD = [
  {k:"int",     lbl:"INT"},
  {k:"sack",    lbl:"sack"},
  {k:"def_td",  lbl:"def TD"},   // pick 6 or fumble return; `td` on a defence is TDs allowed
  {k:"ff",      lbl:"FF"},
  {k:"fum_rec", lbl:"fum rec"},
  {k:"blk_kick",lbl:"blk kick"}
];
let STATS = {};              // sleeper_id -> raw stat object
let liveOn = localStorage.getItem("ct-live") === "1";
let demoOn = new URLSearchParams(location.search).has("demo") || localStorage.getItem("ct-demo") === "1";
let liveTimer = null, liveWeek = null;

// A full NFL game runs about 64 offensive snaps per side, so a team's snap count is a
// decent stand-in for "how much of this game has happened" — and unlike a game clock it
// measures opportunity, which is what actually matters for a fantasy line. Par is a
// respectable full-game PPR total for the position.
const PAR = {QB:17, RB:12, WR:12, TE:9, K:8, DEF:7};
const FULL_GAME_SNAPS = 64;

function pace(p, s){
  const snaps = Number(p.pos === "DEF" ? s.tm_def_snp : s.tm_off_snp) || 0;
  if (!snaps) return null;                          // game has not started, or no snap data
  const prog = Math.min(1, snaps / FULL_GAME_SNAPS);
  if (prog < 0.2) return null;                      // too early to judge anyone
  const pts = Number(s.pts_ppr || 0);
  const exp = (PAR[p.pos] || 10) * prog;
  const r   = exp > 0 ? pts / exp : 0;

  let lbl, dir;
  if      (r >= 1.5)  { lbl = "🔥 on fire"; dir =  1; }
  else if (r >= 1.15) { lbl = "↑ ahead";     dir =  1; }
  else if (r >= 0.85) { lbl = "◆ on pace";  dir =  0; }
  else if (r >= 0.5)  { lbl = "↓ behind";    dir = -1; }
  else                { lbl = "🧊 quiet";   dir = -1; }

  // Colour by what it means for Rob: a boo-side player going off is bad news.
  const helps = p.side === "cheer" ? dir : -dir;
  const tone  = helps > 0 ? "good" : helps < 0 ? "bad" : "";
  const title = `${pts.toFixed(1)} pts through roughly ${Math.round(prog*100)}% of the game · `
              + `par for a ${p.pos} is ${PAR[p.pos]||10} · ${Math.round(r*100)}% of pace`;
  return `<span class="pace ${tone}" title="${title}">${lbl}</span>`;
}

function statChips(p){
  const id = SID[p.name];
  const s = id && STATS[id];
  if (!s) return "";
  const out = [];
  const chip = (n, lbl, tone) =>
    `<span class="stat${tone?" "+tone:""}"><b>${n}</b>${lbl}</span>`;
  const add = (v, lbl, tone) => {
    if (!(v > 0)) return;                          // only greater than zero
    out.push(chip(Number.isInteger(v) ? v : v.toFixed(1), lbl, tone));
  };
  if (p.pos === "DEF"){
    for (const d of DEF_GOOD) add(Number(s[d.k]||0), d.lbl, "good");
    // Points and yards surrendered. Shown whenever the game is under way, so a
    // shutout still reads "0 pts allow" rather than vanishing.
    const yds = Number(s.yds_allow||0), pts = Number(s.pts_allow||0);
    if (yds > 0 || pts > 0){
      out.push(chip(pts, "pts allow", "bad"));
      out.push(chip(yds, "yds allow", "bad"));
    }
  } else {
    const miss = (Number(s.fga||0) - Number(s.fgm||0)) + (Number(s.xpa||0) - Number(s.xpm||0));
    // Sleeper already totals first downs per position; fall back to the parts.
    const fd = Number(s.bonus_fd_qb || s.bonus_fd_rb || s.bonus_fd_wr || s.bonus_fd_te || 0)
             || (Number(s.rush_fd||0) + Number(s.rec_fd||0) + Number(s.pass_fd||0));
    for (const d of STAT_DEFS)
      add(d.k === "_miss" ? miss : d.k === "_fd" ? fd : Number(s[d.k]||0), d.lbl, d.tone);
    for (const d of OFF_BAD)   add(Number(s[d.k]||0), d.lbl, "bad");
  }
  if (!out.length) return "";
  const badge = pace(p, s);
  return `<div class="stats">${badge||""}${out.join("")}</div>`;
}

    pass_yd:0.05, pass_td:6, pass_int:-2, pass_2pt:2,
    rush_yd:0.1, rush_td:6, rush_2pt:2,
    rec:1, rec_yd:0.1, rec_td:6, rec_2pt:2,
    fum_lost:-2, fum_rec_td:6, kr_td:6, pr_td:6,
    xpm:1, fgmiss:-1,
    fgm_0_19:3, fgm_20_29:3, fgm_30_39:3, fgm_40_49:4, fgm_50_59:5, fgm_60p:6,
    // defence / special teams
    sack:1, int:2, fum_rec:2, safe:2, def_td:6, blk_kick:2, blk_kick_ret_td:6, def_st_td:6,
    _pa0:5, _pa1_6:4, _pa7_13:3, _pa14_17:1, _pa28_34:-1, _pa35_45:-3, _pa46p:-5,
    _ya100:5, _ya199:3, _ya299:2, _ya399:-1, _ya449:-3, _ya499:-5, _ya549:-6, _ya550:-7
  }
};

// A league's rules are just weights over the same stat keys Sleeper already publishes,
// plus a few thresholds Sleeper doesn't flag directly.
function derived(s){
  const py = Number(s.pass_yd)||0, ry = Number(s.rush_yd)||0, cy = Number(s.rec_yd)||0;
  const d = {
    _pass400: py>=400?1:0, _pass500: py>=500?1:0,
    _rush200: ry>=200?1:0, _rush250: ry>=250?1:0,
    _rec200:  cy>=200?1:0, _rec250:  cy>=250?1:0
  };
  // ESPN slices points and yards allowed differently than Sleeper's own buckets do, so
  // read the raw totals and cut them ourselves rather than approximating with the wrong tier.
  if ("pts_allow" in s){
    const p = Number(s.pts_allow)||0;
    d._pa0=p===0?1:0; d._pa1_6=p>=1&&p<=6?1:0; d._pa7_13=p>=7&&p<=13?1:0;
    d._pa14_17=p>=14&&p<=17?1:0; d._pa28_34=p>=28&&p<=34?1:0;
    d._pa35_45=p>=35&&p<=45?1:0; d._pa46p=p>=46?1:0;
  }
  if ("yds_allow" in s){
    const y = Number(s.yds_allow)||0;
    d._ya100=y<100?1:0; d._ya199=y>=100&&y<=199?1:0; d._ya299=y>=200&&y<=299?1:0;
    d._ya399=y>=350&&y<=399?1:0; d._ya449=y>=400&&y<=449?1:0; d._ya499=y>=450&&y<=499?1:0;
    d._ya549=y>=500&&y<=549?1:0; d._ya550=y>=550?1:0;
  }
  return d;
}
function leaguePts(p, tbl){
  const s = STATS[SID[p.name]];
  if (!s) return 0;
  const d = derived(s);
  let t = 0;
  for (const k in tbl) t += (k[0]==="_" ? (d[k]||0) : (Number(s[k])||0)) * tbl[k];
  return t;
}

function renderScoreboard(){
  const box = document.getElementById("scoreboard");
  const cards = LEAGUES.filter(l => SCORING[l.id]).map(l => {
    const tbl = SCORING[l.id];
    const sum = arr => arr.reduce((a,p)=>a + leaguePts(p, tbl), 0);
    const mine = sum(ALL.filter(p => p.startFor.includes(l.id)));
    const them = sum(ALL.filter(p => p.startVs.includes(l.id)));
    const d    = mine - them;
    const cls  = d > 0 ? "win" : d < 0 ? "lose" : "";
    const sign = d > 0 ? "+" : "";
    return `<div class="sbcard ${cls}" style="--lgc:${lgColor(l)}" data-sblg="${l.id}"
      role="button" tabindex="0" title="Show only this matchup">
      <div class="sbname">${l.name}</div>
      <div class="sbemblem">${l.icon}</div>
      <div class="sbscore"><b>${mine.toFixed(1)}</b><span class="sbdash">–</span><b>${them.toFixed(1)}</b></div>
      <div class="sbwho">you<span>${l.opp}</span></div>
      <div class="sbmargin">${sign}${d.toFixed(1)}</div>
    </div>`;
  }).join("");
  const pending = LEAGUES.filter(l => !SCORING[l.id]).map(l=>l.name).join(", ");
  box.innerHTML = cards
    ? cards + (pending ? `<div class="sbwait">Waiting on scoring rules for ${pending}</div>` : "")
    : "";
  box.classList.toggle("show", !!cards && Object.keys(STATS).length > 0);
  // A card is a shortcut into the league filter: tap to isolate that matchup, tap again for all.
  box.querySelectorAll("[data-sblg]").forEach(c=>{
    const go = ()=>{
      const id = c.dataset.sblg;
      const only = activeLg.size===1 && activeLg.has(id);
      activeLg = new Set(only ? LEAGUES.map(l=>l.id) : [id]);
      syncLgChips();
      renderScoreboard();
      render();
    };
    c.onclick = go;
    c.onkeydown = e=>{ if(e.key==="Enter"||e.key===" "){ e.preventDefault(); go(); } };
  });
  box.querySelectorAll("[data-sblg]").forEach(c=>
    c.classList.toggle("only", activeLg.size===1 && activeLg.has(c.dataset.sblg)));
}
function syncLgChips(){
  document.querySelectorAll(".lgf").forEach(b=>b.classList.toggle("on", activeLg.has(b.dataset.lg)));
}

async function pullStats(){
  const dot = document.getElementById("liveDot");
  const txt = document.getElementById("liveTxt");
  try{
    let season, week, type = "regular";
    if (demoOn){
      // A finished week of real box scores, so the layout can be judged before kickoff.
      season = "2025"; week = 1;
    } else {
      const st = await (await fetch("https://api.sleeper.app/v1/state/nfl")).json();
      season = st.season; week = st.display_week || st.week || 1; type = st.season_type || "regular";
    }
    liveWeek = week;
    // Sleeper's CDN caches this response, so vary the URL every 30s to force a fresh edge fetch.
    const bust = Math.floor(Date.now()/30000);
    const url = `https://api.sleeper.app/v1/stats/nfl/${type}/${season}/${week}?_=${bust}`;
    STATS = await (await fetch(url, {cache:"no-store"})).json() || {};
    recordPoints();
    const n = ALL.filter(p => statChips(p) !== "").length;
    dot.className = "dot ok";
    const stamp = new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"});
    txt.textContent = demoOn
      ? `DEMO · wk ${week}`
      : (n ? `wk ${week} · ${stamp}` : `wk ${week} · no stats · ${stamp}`);
  }catch(e){
    dot.className = "dot err";
    txt.textContent = "offline — will retry";
  }
  render();
  renderScoreboard();
}
function setLive(on){
  liveOn = on;
  localStorage.setItem("ct-live", on ? "1" : "0");
  document.getElementById("liveBtn").classList.toggle("on", on);
  document.getElementById("livebar").classList.toggle("show", on);
  document.getElementById("demoBtn").classList.toggle("on", demoOn);
  document.getElementById("livebar").classList.toggle("demo", on && demoOn);
  clearInterval(liveTimer); liveTimer = null;
  if (on){ pullStats(); liveTimer = setInterval(pullStats, 60000); }
  else { STATS = {}; HIST = {}; render(); renderScoreboard(); }
}
function setDemo(on){
  demoOn = on;
  localStorage.setItem("ct-demo", on ? "1" : "0");
  setLive(on ? true : liveOn);   // turning demo on implies you want stats visible
}
// Don't burn requests on a backgrounded phone; catch up when the tab returns.
document.addEventListener("visibilitychange", ()=>{
  if (!liveOn) return;
  if (document.hidden){ clearInterval(liveTimer); liveTimer = null; }
  else if (!liveTimer){ pullStats(); liveTimer = setInterval(pullStats, 60000); }
});
/* ---------------- recent scoring ---------------- */
// Ten refreshes at 60s, so a burst of points stays visible for about ten minutes.
const HIST_MS = 10*60*1000;
let HIST = {};   // player name -> [{t, pts}] most recent last

// A player can be in several leagues at once. Points differ per league, so report the
// league that matters most: the highest-weight one where he's actually in the lineup.
function primaryLg(p){
  const started = p.tags.filter(t=>t.slot==="S");
  const pool = started.length ? started : p.tags;
  return pool.slice().sort((a,b)=>LG[b.lg].w - LG[a.lg].w)[0].lg;
}
function primaryPts(p){
  const s = SID[p.name] && STATS[SID[p.name]];
  if (!s) return null;
  const lg = primaryLg(p), tbl = SCORING[lg];
  return tbl ? leaguePts(p, tbl) : null;
}
function recordPoints(){
  const now = Date.now();
  ALL.forEach(p=>{
    const pts = primaryPts(p);
    if (pts === null) return;
    const h = HIST[p.name] || (HIST[p.name] = []);
    const last = h[h.length-1];
    // Only append when the number actually moves, so the window holds real events
    // rather than ten identical samples.
    if (!last || Math.abs(last.pts - pts) > 0.009) h.push({t:now, pts});
    while (h.length > 2 && h[1].t < now - HIST_MS) h.shift();
  });
  if (demoOn) demoScoring(now);
}
// Demo replays a finished week, so the numbers never move on their own. Invent a
// plausible last-few-minutes swing for a handful of players so the feature is visible.
function demoScoring(now){
  const chunks = [6, 6.6, 3, 1.2, 2.4, 0.9, -2, 7.5];
  ALL.forEach((p,i)=>{
    const h = HIST[p.name];
    if (!h || h.length !== 1) return;
    if ((i + Math.floor(now/60000)) % 5 !== 0) return;
    const d = chunks[(i + Math.floor(now/60000)) % chunks.length];
    const ago = (i % 9) * 60000;
    h[0].t = now - ago;
    h.unshift({t: now - ago - 60000, pts: h[0].pts - d});
  });
}
// The newest jump inside the window, or null when nothing has happened lately.
function recentDelta(p){
  const h = HIST[p.name];
  if (!h || h.length < 2) return null;
  const cur = h[h.length-1], prev = h[h.length-2];
  if (Date.now() - cur.t > HIST_MS) return null;
  const d = cur.pts - prev.pts;
  return Math.abs(d) < 0.05 ? null : {d, t:cur.t};
}
function deltaHTML(p){
  const r = recentDelta(p);
  if (!r) return "";
  const mins = Math.floor((Date.now() - r.t)/60000);
  const ago = mins < 1 ? "just now" : mins + "m ago";
  // Green means good news for Rob: his guy scored, or the guy he's booing lost ground.
  const good = p.side==="cheer" ? r.d > 0 : r.d < 0;
  const sign = r.d > 0 ? "+" : "−";
  return `<div class="delta ${good?"good":"bad"}" title="${primaryLg(p)==null?"":LG[primaryLg(p)].name} scoring">
    <b>${sign}${Math.abs(r.d).toFixed(1)}</b><span>${ago}</span></div>`;
}
/* ---------------- render ---------------- */
let view="priority", activeLg=new Set(LEAGUES.map(l=>l.id)), q="";
const USED_SLOTS = Object.keys(SLOTS)
  .filter(s=>ALL.some(p=>p.gs===s))
  .sort((a,b)=>SLOTS[a].ord-SLOTS[b].ord);
let activeSlots = new Set(USED_SLOTS);

/* theme */
const themeBtn = document.getElementById("themeBtn");
function applyTheme(t){
  document.documentElement.setAttribute("data-theme", t);
  themeBtn.textContent = t==="light" ? "☀️" : "🌙";
  document.getElementById("themeColor").setAttribute("content", t==="light" ? "#f6f8fa" : "#0d1117");
  try{ localStorage.setItem("cheerTheme", t); }catch(e){}
  if (typeof render === "function") render();
}
let theme = (()=>{ try{ return localStorage.getItem("cheerTheme"); }catch(e){ return null; } })()
  || (window.matchMedia && matchMedia("(prefers-color-scheme: light)").matches ? "light" : "dark");
themeBtn.onclick = ()=> applyTheme(document.documentElement.getAttribute("data-theme")==="light" ? "dark" : "light");

function lgColor(l){
  return document.documentElement.getAttribute("data-theme")==="light" ? l.light : l.color;
}
function pillsFor(p){
  const played = SID[p.name] && STATS[SID[p.name]];
  return p.tags
    .sort((a,b)=> (a.side===b.side ? LG[b.lg].w - LG[a.lg].w : a.side==="for" ? -1 : 1))
    .map(t=>{
      const l=LG[t.lg];
      const mine = t.side==="for";
      const bench = t.slot!=="S";
      const suffix = bench ? (t.slot==="IR" ? " · IR" : " · bench") : "";
      // Each league scores the same box score differently, so the number rides on its own pill.
      const tbl = SCORING[t.lg];
      const pts = (played && tbl) ? leaguePts(p, tbl) : null;
      const num = pts===null ? "" : `<b>${pts.toFixed(1)}</b>`;
      const tip = (mine ? "On your team" : "On your opponent") + " in " + l.name
        + (bench ? (t.slot==="IR" ? " (IR)" : " (bench)") : "")
        + (pts===null ? "" : ` — ${pts.toFixed(2)} pts by ${l.name} scoring`);
      return `<span class="pill ${mine?"mine":"opp"}${bench?" bench":""}" title="${tip}">${l.name}${suffix}${num}</span>`;
    }).join("");
}
function rowHTML(p){
  const cheering = p.side==="cheer";
  const icon = cheering ? "▲" : "👎";
  const col  = p.conflict ? "var(--gold)" : cheering ? "var(--good)" : "var(--fire)";
  const tip = [p.why, p.bwhy].filter(Boolean).join(" · ").replace(/"/g,"&quot;");
  return `<div class="row" title="${tip}" style="border-left-color:${col}">
    <div class="rate${cheering?" up":""}" title="Level ${p.level} of 5">${icon.repeat(p.level)}</div>
    <div class="who">
      <div class="nm">${p.conflict?'<span class="warn" title="On one of your teams AND an opponent\'s">⚔ </span>':""}${p.name} <span class="pos">${p.pos} · ${p.team} ${p.opp}</span></div>
      <div class="pills">${pillsFor(p)}</div>
      ${statChips(p)}
    </div>
    <div class="game">${SLOTS[p.gs].lbl}${deltaHTML(p)}</div>
  </div>`;
}
function visible(){
  const s=q.trim().toLowerCase();
  return ALL.filter(p=>{
    if (!p.tags.some(t=>activeLg.has(t.lg))) return false;
    if (!activeSlots.has(p.gs)) return false;
    if (s && !(p.name.toLowerCase().includes(s)||p.team.toLowerCase().includes(s)||p.pos.toLowerCase().includes(s))) return false;
    return true;
  });
}
function column(list, tiers, sideKey){
  const live = list.filter(p=>p.bucket>=2);
  const dead = list.filter(p=>p.bucket===1);
  let html="";
  if (view==="priority"){
    for (const t of tiers){
      const g=live.filter(p=>p.bucket===t.n);
      if(!g.length) continue;
      html += `<h2 class="sec">${t.t} <span class="cnt">· ${g.length}</span></h2>`;
      html += g.map(rowHTML).join("");
    }
  } else {
    for (const s of Object.keys(SLOTS).sort((a,b)=>SLOTS[a].ord-SLOTS[b].ord)){
      const g=live.filter(p=>p.gs===s).sort((x,y)=>y.bucket-x.bucket||y.level-x.level);
      if(!g.length) continue;
      html += `<h2 class="sec">${SLOTS[s].lbl} <span class="cnt">· ${g.length}</span></h2>`;
      html += g.map(rowHTML).join("");
    }
  }
  if (!html) html = `<div class="empty">Nobody here.</div>`;
  if (dead.length){
    const h = DEAD_HDR[sideKey];
    const rows = dead.slice().sort((x,y)=>y.level-x.level||x.name.localeCompare(y.name)).map(rowHTML).join("");
    html += `<details class="dead"><summary>${h.t} <span class="cnt">· ${dead.length}</span></summary>
      ${rows}</details>`;
  }
  return html;
}
function render(){
  const list = visible();
  const cheer = list.filter(p=>p.side==="cheer");
  const boo   = list.filter(p=>p.side==="boo");
  const live  = a => a.filter(p=>p.bucket>=2).length;
  document.getElementById("cheerCount").textContent = live(cheer);
  document.getElementById("booCount").textContent   = live(boo);
  document.getElementById("cheerTab").textContent   = live(cheer);
  document.getElementById("booTab").textContent     = live(boo);
  // Re-rendering shrinks the page and the browser clamps scroll to the new
  // bottom. Remember where we were so changing a filter never yanks you up.
  const y = window.scrollY;
  document.getElementById("cheerCol").innerHTML = column(cheer, CHEER_TIERS, "cheer");
  document.getElementById("booCol").innerHTML   = column(boo,   BOO_TIERS,   "boo");
  if (y && window.scrollY !== y) requestAnimationFrame(()=>window.scrollTo(0, y));
}
document.getElementById("lgfilters").innerHTML = LEAGUES.map(l=>
  `<button class="tg on lgf" data-lg="${l.id}" style="--lgc:${lgColor(l)}"
     title="${l.rank} · ${l.site} — you play ${l.opp}">${l.name}</button>`).join(" ");
document.getElementById("slotfilters").innerHTML = USED_SLOTS.map(s=>
  `<button class="tg slf" data-slot="${s}">${SLOTS[s].short}</button>`).join(" ");

function syncSlotButtons(){
  const all = activeSlots.size===USED_SLOTS.length;
  document.getElementById("allSlots").classList.toggle("on", all);
  document.querySelectorAll(".slf").forEach(b=>
    b.classList.toggle("on", !all && activeSlots.has(b.dataset.slot)));
}
document.getElementById("allSlots").onclick=()=>{
  activeSlots=new Set(USED_SLOTS); syncSlotButtons(); render();
};
document.querySelectorAll(".slf").forEach(b=>b.onclick=()=>{
  const s=b.dataset.slot;
  if (activeSlots.size===USED_SLOTS.length) activeSlots=new Set([s]);   // first pick = solo
  else if (activeSlots.has(s)){ activeSlots.delete(s); if(!activeSlots.size) activeSlots=new Set(USED_SLOTS); }
  else activeSlots.add(s);
  syncSlotButtons(); render();
});
document.querySelectorAll("[data-view]").forEach(b=>b.onclick=()=>{
  view=b.dataset.view;
  document.querySelectorAll("[data-view]").forEach(x=>x.classList.toggle("on",x===b));
  render();
});
document.querySelectorAll(".lgf").forEach(b=>b.onclick=()=>{
  const id=b.dataset.lg;
  if(activeLg.has(id)&&activeLg.size>1){activeLg.delete(id);b.classList.remove("on");}
  else {activeLg.add(id);b.classList.add("on");}
  renderScoreboard();
  render();
});
document.querySelectorAll(".mtabs button").forEach(b=>b.onclick=()=>{
  document.body.dataset.side=b.dataset.side;
  document.querySelectorAll(".mtabs button").forEach(x=>x.classList.toggle("on",x===b));
});
document.getElementById("q").oninput=e=>{q=e.target.value;render();};
document.getElementById("liveBtn").onclick=()=>setLive(!liveOn);
document.getElementById("demoBtn").onclick=()=>setDemo(!demoOn);
document.body.dataset.side="cheer";
syncSlotButtons();
applyTheme(theme);
setLive(liveOn || demoOn);   // arriving with ?demo=1 should show stats without a second tap
</script>
</body>
</html>
